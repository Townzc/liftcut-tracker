name: CI

on:
  push:
    branches: [main, aliyun]
  pull_request:

permissions:
  contents: read

jobs:
  agent-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check authored fixtures
        run: |
          python research/liftcut-agent/benchmark/build_dev_seeds.py --check
          python research/liftcut-agent/benchmark/build_interactive_seeds.py --check
          python research/liftcut-agent/recovery_dataset.py check
          python research/liftcut-agent/controlled_recovery.py check
          python research/liftcut-agent/state_coverage.py check

      - name: Validate development scenarios
        run: |
          python research/liftcut-agent/run.py validate
          python research/liftcut-agent/interact.py validate

      - name: Run evaluator regression tests
        run: python -m unittest discover -s research/liftcut-agent/tests -v

      - name: Verify CI tokenizer cache integrity and bounded retry
        run: python -m unittest discover -s tests/ci -v

      - name: Verify M4 startup and timeout without a GPU or downloads
        run: |
          bash -n research/m4-parser/run_all.sh
          python research/m4-parser/test_runner.py -v
          python research/m4-parser/test_v2_runner.py -v
          python research/m4-parser/test_v3_runner.py -v
          python research/m4-parser/test_v4_runner.py -v
          python research/m4-parser/test_v5_runner.py -v
          python research/m4-parser/test_v5_backup.py -v
          python research/m4-parser/test_v6_backup.py -v
          python research/m4-parser/test_v6_inputs.py -v
          python research/m4-parser/test_v6_runner.py -v
          python research/m4-parser/test_loss_mass.py -v
          python research/m4-parser/test_closed_decode.py -v

      - name: Rebuild the saved G1 trajectory viewer without model calls
        run: python research/liftcut-agent/trajectory_demo.py --study g1 --public-dir research/liftcut-agent/reports/g1-seed42-2026-10-02 --output research/liftcut-agent/reports/g1-trajectory-demo-2026-10-03.html --check

      - name: Rebuild the saved G2 trajectory viewer without model calls
        run: python research/liftcut-agent/trajectory_demo.py --study g2 --public-dir research/liftcut-agent/reports/g2-seed42-2026-10-03 --output research/liftcut-agent/reports/g2-trajectory-demo-2026-10-03.html --check

      - name: Run deterministic contract baseline
        run: python research/liftcut-agent/run.py baseline

      - name: Run and replay interactive workflow
        run: |
          python research/liftcut-agent/interact.py run --write-traces research/liftcut-agent/outputs/ci-traces.jsonl
          python research/liftcut-agent/interact.py replay --traces research/liftcut-agent/outputs/ci-traces.jsonl
          python research/liftcut-agent/interact.py replay --traces research/liftcut-agent/reports/interactive-fixed-traces-2026-09-28.jsonl

      - name: Run and replay model protocol smoke without credentials
        run: |
          python research/liftcut-agent/model.py mock --output-dir research/liftcut-agent/outputs/ci-model
          python research/liftcut-agent/model.py replay --config research/liftcut-agent/outputs/ci-model/config.json --episodes research/liftcut-agent/outputs/ci-model/episodes.jsonl
          python research/liftcut-agent/model.py replay --config research/liftcut-agent/reports/deepseek-pilot-2026-09-28/config.json --scenario interactive-008 --episodes research/liftcut-agent/reports/deepseek-pilot-2026-09-28/episodes.jsonl

      - name: Audit hosted artifacts and cost ledger without network calls
        run: python research/liftcut-agent/audit.py --run-dir research/liftcut-agent/reports/deepseek-pilot-2026-09-28 --run-dir research/liftcut-agent/reports/deepseek-development-2026-09-28

      - name: Audit GPU pilot and local development traces without weights or GPU
        run: python research/liftcut-agent/audit_gpu.py

      - name: Verify opaque identifiers and replay the diagnostic comparison
        run: |
          python research/liftcut-agent/blind_recovery_ids.py --check
          python research/liftcut-agent/audit_identifier_probe.py --run-dir research/liftcut-agent/reports/qwen-recovery-pilot-2026-09-28

      - name: Exercise the complete protocol matrix and decision export offline
        run: |
          python research/liftcut-agent/protocol_experiment.py mock --output-dir research/liftcut-agent/outputs/ci-protocol-matrix
          python research/liftcut-agent/compare_protocols.py --run-root research/liftcut-agent/outputs/ci-protocol-matrix
          python research/liftcut-agent/export_trajectories.py --run-dir research/liftcut-agent/reports/deepseek-development-2026-09-28 --output-dir research/liftcut-agent/outputs/ci-decisions

  m4-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/m4-parser/train/requirements-loss-cpu.txt
      - name: Install CPU-only autograd runtime without model weights
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r research/m4-parser/train/requirements-loss-cpu.txt
      - name: Verify causal loss, masking, padding and actual tiny-model gradients
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python research/m4-parser/test_sample_mean_loss.py -v

  tokenizer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/liftcut-agent/requirements-tokenizer.txt
      - name: Install tokenizer-only dependencies (no training framework)
        run: pip install -r research/liftcut-agent/requirements-tokenizer.txt
      - uses: actions/cache/restore@v6
        id: tokenizer-cache
        with:
          path: research/liftcut-agent/outputs/ci-tokenizer-cache
          key: pinned-tokenizer-v1-${{ hashFiles('research/liftcut-agent/configs/qwen3-4b-tokenizer.json') }}
      - name: Verify cached hashes or fetch public tokenizer with bounded backoff
        run: python tools/ci_tokenizer.py --output-dir research/liftcut-agent/outputs/ci-tokenizer --cache-dir research/liftcut-agent/outputs/ci-tokenizer-cache
      - uses: actions/cache/save@v6
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        with:
          path: research/liftcut-agent/outputs/ci-tokenizer-cache
          key: pinned-tokenizer-v1-${{ hashFiles('research/liftcut-agent/configs/qwen3-4b-tokenizer.json') }}
      - name: Reproduce the real tokenizer loss-mask audit on CPU
        run: |
          python research/liftcut-agent/tokenize_decisions.py --decisions-dir research/liftcut-agent/reports/development-decisions-2026-09-28 --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-mask --max-length 4096
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/liftcut-agent')
          expected = json.loads((root / 'reports/qwen-mask-audit-2026-09-28.json').read_text())
          actual = json.loads((root / 'outputs/ci-mask/report.json').read_text())
          assert actual == expected, 'CPU tokenizer audit differs from published evidence'
          PY
      - name: Reproduce paired recovery decisions and exact token budgets on CPU
        run: python research/liftcut-agent/prepare_recovery.py --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-recovery-prepared
      - name: Replay the published recovery comparison without adapter weights
        run: python research/liftcut-agent/audit_recovery.py --run-dir research/liftcut-agent/reports/qwen-recovery-pilot-2026-09-28 --prepared-dir research/liftcut-agent/outputs/ci-recovery-prepared --metadata-only
      - name: Reproduce coverage and masked-failure forensic review
        run: python research/liftcut-agent/review_recovery.py --prepared-dir research/liftcut-agent/outputs/ci-recovery-prepared --check
      - name: Reproduce corrected data, error prefixes and paired recovery-v2 tokens
        run: python research/liftcut-agent/prepare_controlled.py --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-controlled-prepared
      - name: Verify all controlled-recovery public artifacts and replay the review
        run: python research/liftcut-agent/publish_controlled.py --run-dir research/liftcut-agent/reports/qwen-controlled-recovery-2026-09-29 --prepared-dir research/liftcut-agent/outputs/ci-controlled-prepared --check-publication

      - name: Reproduce fixed-state diagnostic prefixes, reference replay and handoff token limits
        run: python research/liftcut-agent/prepare_state_diagnostics.py --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-state-diagnostics

      - name: Verify published fixed-state evidence and reproduce the descriptive review
        run: python research/liftcut-agent/publish_state_diagnostics.py --run-dir research/liftcut-agent/reports/qwen-state-diagnostics-2026-09-29 --prepared-dir research/liftcut-agent/outputs/ci-state-diagnostics --check-publication

      - name: Reproduce retrospective state-coverage analysis of the exact v2 training pools
        run: python research/liftcut-agent/review_training_state_coverage.py --prepared-dir research/liftcut-agent/outputs/ci-controlled-prepared --check

      - name: Reproduce four paired state-coverage arms and exact supervised-token schedules
        run: python research/liftcut-agent/prepare_state_coverage.py --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-state-coverage

      - name: Verify the bounded coverage window without GPU execution
        run: python research/liftcut-agent/run_state_coverage_window.py --model-dir model --model-manifest manifest --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics --output-dir research/liftcut-agent/outputs/ci-window-dry-run

      - name: Verify four-arm public evidence and replay all 124 episodes
        run: python research/liftcut-agent/publish_state_coverage.py --run-dir research/liftcut-agent/reports/qwen-state-coverage-2026-09-29 --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics --check-publication

      - name: Independently reconstruct every recorded coverage prompt and decode output IDs
        run: python research/liftcut-agent/audit_coverage_tokens.py --run-dir research/liftcut-agent/reports/qwen-state-coverage-2026-09-29 --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --check research/liftcut-agent/reports/qwen-state-coverage-2026-09-29/generation-token-audit.json

      - name: Reproduce the retrospective follow-up design analysis from exact training decisions
        run: python research/liftcut-agent/analyze_coverage_followup.py --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --check

      - name: Reproduce seed42 equivalence and seed43/44 preparation twice without GPU
        run: |
          for COPY in a b; do
            python research/liftcut-agent/prepare_coverage_replication.py --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics --output-dir research/liftcut-agent/outputs/ci-replication-$COPY
          done
          diff -r research/liftcut-agent/outputs/ci-replication-a research/liftcut-agent/outputs/ci-replication-b
          python research/liftcut-agent/prepare_coverage_replication.py --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics --output-dir research/liftcut-agent/outputs/ci-replication-a --verify-only

      - name: Verify both bounded replication plans without process launch or GPU
        run: |
          for SEED in 43 44; do
            python research/liftcut-agent/run_coverage_replication_window.py --model-dir model --model-manifest manifest --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics --replication-dir research/liftcut-agent/outputs/ci-replication-a --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-replication-dry-$SEED --seed "$SEED" --expected-code-commit "$(git rev-parse HEAD)" --hourly-cny 2.18
            test ! -e research/liftcut-agent/outputs/ci-replication-dry-$SEED
          done

      - name: Check the seed44 local collector offline without creating a run or connecting
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path("research/liftcut-agent")
          sys.path[:0] = [str(root), str(root / "src")]
          from monitor_coverage_replication import parse_config, offline_preflight
          from server_workspace import sha256
          cfg = json.loads((root / "configs/coverage-replication-monitor-seed44.example.json").read_text())
          for key, directory in {
              "prepared": "ci-state-coverage", "diagnostic": "ci-state-diagnostics",
              "replication": "ci-replication-a", "tokenizer": "ci-tokenizer",
              "downloads": "ci-monitor-downloads", "restored": "ci-monitor-restored",
              "operations": "ci-monitor-operations",
          }.items():
              cfg[key] = str(root / "outputs" / directory)
          cfg["restore_python"] = sys.executable
          parsed = parse_config(cfg)
          plan, report = offline_preflight(parsed)
          assert plan["seed"] == 44 and report["gpu_calls"] == 0
          assert not report["server_state_verified"] and not report["boot_time_configured"]
          assert all(not parsed[k].exists() for k in ("downloads", "restored", "operations"))
          saved = json.loads((root / "reports/seed44-monitor-readiness-2026-10-01.json").read_text())
          assert report["execution_commit"] == saved["execution_commit"]
          assert {name: sha256(root / name) for name in report["frozen_sources_verified"]} == saved["frozen_source_sha256"]
          assert {name: sha256(parsed["replication"] / name) for name in saved["preparation"]["file_sha256"]} == saved["preparation"]["file_sha256"]
          print(json.dumps(report, indent=2))
          PY

      - name: Verify seed43 public evidence and reproduce its descriptive review
        run: |
          python research/liftcut-agent/publish_coverage_replication.py \
            --run-dir research/liftcut-agent/reports/qwen-coverage-replication-seed43-2026-10-01 \
            --prepared-dir research/liftcut-agent/outputs/ci-state-coverage \
            --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics \
            --replication-dir research/liftcut-agent/outputs/ci-replication-a \
            --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer \
            --seed 43 --check-publication --allow-missing-weights

          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("research/liftcut-agent")
          sys.path[:0] = [str(root), str(root / "src")]
          from prepare_coverage_replication import ARMS, read
          from review_coverage_replication_seed import summarize, training_observation
          from server_workspace import sha256

          run = root / "reports/qwen-coverage-replication-seed43-2026-10-01"
          historical = root / "reports/qwen-state-coverage-2026-09-29"
          review_path = root / "reports/coverage-replication-seed43-review-2026-10-01.json"
          assert sum(p.is_file() for p in run.rglob("*")) == 81

          # Earlier CI steps verified both public evidence bundles. These are
          # unchanged historical audit records, not new weight verification.
          derived = summarize(
              43, read(run / "comparison.json"),
              read(historical / "comparison.json"),
          )
          derived["training"] = {
              arm: training_observation(run / "training" / arm)
              for arm in ARMS
          }
          derived["source_sha256"] = {
              "seed42_comparison": sha256(historical / "comparison.json"),
              "current_comparison": sha256(run / "comparison.json"),
          }

          saved = read(review_path)
          recorded_verification = saved.pop("verification")
          assert recorded_verification == {
              "current_actual_weights": True,
              "current_native_and_environment_replay": True,
              "current_token_ids": True,
              "seed42_metadata_replay": True,
              "seed42_actual_weights_rechecked": False,
          }, "Historical local verification attestation changed"
          assert derived == saved, "Published single-seed review differs from evidence"
          print({
              "derived_review_reproduced": True,
              "actual_weights_verified_in_this_ci_run": False,
              "historical_weight_attestation_preserved": True,
              "new_model_calls": 0,
          })
          PY

      - name: Verify seed44 public evidence and reproduce the original three-seed review
        run: |
          python research/liftcut-agent/publish_coverage_replication.py \
            --run-dir research/liftcut-agent/reports/qwen-coverage-replication-seed44-2026-10-02 \
            --prepared-dir research/liftcut-agent/outputs/ci-state-coverage \
            --diagnostic-dir research/liftcut-agent/outputs/ci-state-diagnostics \
            --replication-dir research/liftcut-agent/outputs/ci-replication-a \
            --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer \
            --seed 44 --check-publication --allow-missing-weights

          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("research/liftcut-agent")
          sys.path[:0] = [str(root), str(root / "src")]
          from prepare_coverage_replication import ARMS, read
          from review_coverage_replication_seed import summarize, training_observation
          from review_coverage_replication import summarize as summarize_three
          from plot_coverage_replication_review import validate_review
          from server_workspace import sha256

          runs = {
              42: root / "reports/qwen-state-coverage-2026-09-29",
              43: root / "reports/qwen-coverage-replication-seed43-2026-10-01",
              44: root / "reports/qwen-coverage-replication-seed44-2026-10-02",
          }
          assert sum(p.is_file() for p in runs[44].rglob("*")) == 81
          comparisons = {seed: read(run / "comparison.json") for seed, run in runs.items()}
          # All three public bundles were replayed earlier in this job. Their
          # saved local weight attestations are not new CI weight verification.
          derived = summarize(44, comparisons[44], comparisons[42])
          derived["training"] = {
              arm: training_observation(runs[44] / "training" / arm) for arm in ARMS
          }
          derived["source_sha256"] = {
              "seed42_comparison": sha256(runs[42] / "comparison.json"),
              "current_comparison": sha256(runs[44] / "comparison.json"),
          }
          saved = read(root / "reports/coverage-replication-seed44-review-2026-10-02.json")
          assert saved.pop("verification") == {
              "current_actual_weights": True,
              "current_native_and_environment_replay": True,
              "current_token_ids": True,
              "seed42_metadata_replay": True,
              "seed42_actual_weights_rechecked": False,
          }
          assert derived == saved, "Seed44 descriptive review differs from evidence"

          three = summarize_three(comparisons)
          three["source_sha256"] = {
              f"seed{seed}_comparison": sha256(run / "comparison.json")
              for seed, run in runs.items()
          }
          assert comparisons[43]["initial_adapter_sha256"] != comparisons[44]["initial_adapter_sha256"]
          three["initialization"] = {
              "seed42": "not recorded by the historical runner",
              "seed43": comparisons[43]["initial_adapter_sha256"],
              "seed44": comparisons[44]["initial_adapter_sha256"],
              "new_seeds_differ": True,
          }
          assert three == read(root / "reports/coverage-replication-three-seed-review-2026-10-02.json")
          validate_review(three)
          for name in ("coverage-replication-seed44-launch-2026-10-02",
                       "coverage-replication-seed43-late-closure-2026-10-02"):
              directory = root / "reports" / name
              acquisition = read(directory / "acquisition.json")
              assert {p.name for p in directory.iterdir()} == {
                  "acquisition.json", *(item["name"] for item in acquisition["files"])
              }
              for item in acquisition["files"]:
                  path = directory / item["name"]
                  assert path.stat().st_size == item["bytes"] and sha256(path) == item["sha256"]
          import json
          import datetime as dt
          ops = root / "reports/coverage-replication-seed44-operations-2026-10-02"
          observed = read(ops / "observations.json")
          for name, expected in observed["evidence_sha256"].items():
              assert sha256(ops / name) == expected
          events = [json.loads(line) for line in (ops / "events.jsonl").read_text().splitlines()]
          event = lambda key: next(e for e in events if e["event"] == key)
          receipt = event("off_instance_verified")["receipt"]
          assert receipt["run_binding"] == comparisons[44]["run_binding"] == observed["run_binding"]
          assert receipt["complete_study_replayed"] and receipt["adapter_files_verified"] and receipt["token_ids_verified"]
          assert receipt["episodes_replayed"] == 124 and receipt["test_episodes"] == 0
          assert len(receipt["archives"]) == 5 and sum(a["verified_files"] for a in receipt["archives"]) == 100
          restored = observed["local_complete_restore"]
          assert restored["verified_event_at_utc"] == event("off_instance_verified")["at_utc"]
          assert restored["receipt_sha256"] == event("receipt_temporary_verified")["receipt_sha256"] == event("receipt_atomic_published")["receipt_sha256"]
          tokens = read(runs[44] / "generation-token-audit.json")
          assert restored["recorded_generations_reconstructed"] == sum(
              panel["actual_model_generations"] for arm in tokens["panels"].values() for panel in arm.values()
          ) == 358
          assert observed["receipt_transfer"]["server_acceptance"] == "unknown"
          assert observed["shutdown_observations"]["server_ack_record_captured"] is False
          assert observed["shutdown_observations"]["shutdown_command_return_observed"] is False
          user = read(ops / "user-platform-confirmation.json")
          assert user["power_state_user_confirmed"] == "off"
          assert user["reported_run_cost_cny"] == observed["budget"]["user_reported_actual_run_cost_cny"] == 4.6
          assert not user["provider_api_or_invoice_independently_inspected"]
          budget = observed["budget"]
          seconds = (dt.datetime.fromisoformat(event("monitor_stopped")["at_utc"]) - dt.datetime.fromisoformat(budget["booted_at_proxy"])).total_seconds()
          assert seconds == budget["boot_to_connection_loss_seconds"]
          assert seconds / 3600 * budget["hourly_cny_assumed"] == budget["compute_proxy_to_connection_loss_cny"]
          print({"seed44_review_reproduced": True, "original_three_seed_review_reproduced": True,
                 "actual_weights_verified_in_this_ci_run": False,
                 "historical_weight_attestation_preserved": True,
                 "new_model_calls": 0, "test_episodes": 0})
          PY

      - name: Reproduce R1 shortfall audit and CPU clarification interventions
        run: python research/liftcut-agent/analyze_agent_shortfalls.py --prepared-dir research/liftcut-agent/outputs/ci-state-coverage --check

      - name: Reproduce eighty D2 contracts and real handoff tokens twice without inference
        run: |
          for COPY in a b; do
            python research/liftcut-agent/prepare_counterfactual_diagnostics.py --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-d2-$COPY
          done
          diff -r research/liftcut-agent/outputs/ci-d2-a research/liftcut-agent/outputs/ci-d2-b
          python research/liftcut-agent/prepare_counterfactual_diagnostics.py --output-dir research/liftcut-agent/outputs/ci-d2-a --verify-only

      - name: Verify D2 operating contract and native CPU drill without weights or inference
        run: |
          python research/liftcut-agent/prepare_d2_execution.py --prepared-dir research/liftcut-agent/outputs/ci-d2-a
          python research/liftcut-agent/drill_d2_execution.py --prepared-dir research/liftcut-agent/outputs/ci-d2-a --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer --output-dir research/liftcut-agent/outputs/ci-d2-drill
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/liftcut-agent')
          observed = json.loads((p / 'outputs/ci-d2-drill/drill-report.json').read_text())
          expected = json.loads((p / 'reports/d2-operating-drill-v2-2026-10-02.json').read_text())
          # CI reconstructs actual tokenizer/environment, but has no private
          # adapter files and must never claim a complete restoration receipt.
          expected['actual_seed42_adapter_bytes_verified'] = False
          expected['full_restore_and_local_receipt_consumption'] = False
          assert observed == expected
          assert not list((p / 'outputs/ci-d2-drill').rglob('off-instance-backup.json'))
          PY

      - name: Replay the historical partial D2 S0 arm without upgrading its receipt
        run: >-
          python research/liftcut-agent/analyze_d2_partial.py
          --public-dir research/liftcut-agent/reports/d2-partial-s0-2026-10-02
          --prepared-dir research/liftcut-agent/outputs/ci-d2-a
          --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer
          --metadata-only --check

      - name: Reconstruct the complete fixed-seed D2 result and paired review
        run: >-
          python research/liftcut-agent/analyze_d2_results.py
          --public-dir research/liftcut-agent/reports/d2-fixed-seed42-2026-10-02
          --prepared-dir research/liftcut-agent/outputs/ci-d2-a
          --tokenizer-dir research/liftcut-agent/outputs/ci-tokenizer
          --metadata-only --check

