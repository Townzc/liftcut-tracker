  i2-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/liftcut-agent/requirements-tokenizer.txt
      - name: Install tokenizer-only dependencies (no model weights or paid API)
        run: pip install -r research/liftcut-agent/requirements-tokenizer.txt
      - uses: actions/cache/restore@v6
        id: tokenizer-cache
        with:
          path: research/liftcut-agent/outputs/ci-tokenizer-cache
          key: pinned-tokenizer-v1-${{ hashFiles('research/liftcut-agent/configs/qwen3-4b-tokenizer.json') }}
      - name: Verify cached hashes or fetch public tokenizer with bounded backoff
        run: python tools/ci_tokenizer.py --output-dir research/liftcut-agent/outputs/ci-i2-tokenizer --cache-dir research/liftcut-agent/outputs/ci-tokenizer-cache
      - uses: actions/cache/save@v6
        if: steps.tokenizer-cache.outputs.cache-hit != 'true'
        with:
          path: research/liftcut-agent/outputs/ci-tokenizer-cache
          key: pinned-tokenizer-v1-${{ hashFiles('research/liftcut-agent/configs/qwen3-4b-tokenizer.json') }}
      - name: Rebuild the frozen development inputs for I2
        run: |
          python research/liftcut-agent/prepare_state_diagnostics.py --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer --output-dir research/liftcut-agent/outputs/ci-i2-diagnostic
          python research/liftcut-agent/prepare_counterfactual_diagnostics.py --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer --output-dir research/liftcut-agent/outputs/ci-i2-d2
      - name: Reconstruct all 444 actual I2 traces, token IDs, inverse mappings and five paired comparisons
        run: |
          python research/liftcut-agent/analyze_i2_results.py --public-dir research/liftcut-agent/reports/i2-seed42-2026-10-13 --diagnostic-dir research/liftcut-agent/outputs/ci-i2-diagnostic --d2-dir research/liftcut-agent/outputs/ci-i2-d2 --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer --check
          python research/liftcut-agent/analyze_i2_failures.py --public-dir research/liftcut-agent/reports/i2-seed42-2026-10-13 --check

      - name: Rehearse I3 ID diagnostics with scripted calls and explicit partial recovery
        run: |
          python research/liftcut-agent/prepare_i3.py --drill --output-dir research/liftcut-agent/outputs/ci-i3-drill --d2-dir research/liftcut-agent/outputs/ci-i2-d2 --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('research/liftcut-agent')
          actual=json.loads((r/'outputs/ci-i3-drill/readiness.json').read_text())
          expected=json.loads((r/'reports/i3-readiness-v1.json').read_text())
          # Archive timestamps differ. CI deliberately has no private weights.
          expected.update(actual_parent_weight_verified=False,complete_scripted_delta_restore=False)
          actual.pop('delta_archive_bytes');expected.pop('delta_archive_bytes')
          assert actual==expected and not actual['model_result']
          receipt=json.loads((r/'outputs/ci-i3-drill/restored/off-instance-backup.json').read_text())
          assert receipt['episodes_replayed']==0 and not receipt['complete_study_replayed']
          assert not receipt['actual_external_weight_verified'] and not receipt['archive_is_self_contained']
          import hashlib
          failed=r/'reports/i3-startup-2026-10-13'
          for name,h in json.loads((failed/'sha256.json').read_text()).items():
              assert hashlib.sha256((failed/name).read_bytes()).hexdigest()==h
          old=json.loads((failed/'original-execution.json').read_text())
          current=json.loads((r/'reports/i3-execution-v1.json').read_text())
          assert {k:v for k,v in old.items() if k!='source_sha256'}=={k:v for k,v in current.items() if k!='source_sha256'}
          assert {k for k in old['source_sha256'] if old['source_sha256'][k]!=current['source_sha256'][k]}=={'launch_i3.py'}
          observed=json.loads((failed/'inspection/verified.json').read_text())
          assert not observed['workers'] and not observed['gpu_pids'] and not any(observed['path_exists'].values())
          assert observed['remote_files_modified']==0 and observed['new_model_calls']==0
          PY

      - name: Reconstruct actual I3 ID decisions and genuine receipt consumption
        run: |
          python research/liftcut-agent/analyze_i3_results.py --public-dir research/liftcut-agent/reports/i3-seed42-2026-10-13 --d2-dir research/liftcut-agent/outputs/ci-i2-d2 --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer --check

      - name: Verify fixed D system and rehearse E1 on development tasks only
        run: |
          python research/liftcut-agent/candidate_d.py --check
          python research/liftcut-agent/prepare_e1.py --output-dir research/liftcut-agent/outputs/ci-e1-development
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('research/liftcut-agent')
          actual=json.loads((r/'outputs/ci-e1-development/report.json').read_text())
          expected=json.loads((r/'reports/e1-offline-readiness-v1.json').read_text())
          assert actual==expected
          assert not actual['model_result'] and not actual['can_launch']
          assert actual['heldout_tasks_read']==actual['model_calls']==0
          PY

      - name: Rehearse E1 full tasks using development copies and a partial weightless restore
        run: |
          python research/liftcut-agent/prepare_e1_execution.py --drill --output-dir research/liftcut-agent/outputs/ci-e1-runtime --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          r=Path('research/liftcut-agent')
          actual=json.loads((r/'outputs/ci-e1-runtime/readiness.json').read_text())
          expected=json.loads((r/'reports/e1-execution-readiness-v2.json').read_text())
          for key in ('source_sha256','frozen_execution_digest','scripted_fixture_plan_digest','arms',
                      'model_result','new_model_calls','reserved_task_payloads_read',
                      'development_original_tasks','development_copies','full_scripted_episodes'):
              assert actual[key]==expected[key],key
          assert not actual['actual_parent_weight_verified'] and not actual['complete_scripted_delta_restore']
          assert not actual['scripted_decision']['candidate_passed']
          receipt=json.loads((r/'outputs/ci-e1-runtime/restored/off-instance-backup.json').read_text())
          assert receipt['episodes_replayed']==0 and not receipt['complete_study_replayed']
          assert not receipt['model_result'] and not receipt['actual_external_weight_verified']
          for item in json.loads((r/'reports/e1-data-exposure-audit-v1.json').read_text())['source_evidence']:
              assert hashlib.sha256((r/item['path']).read_bytes()).hexdigest()==item['sha256']
          PY

      - name: Rehearse original E1 trial limits inside the separate day lease
        run: |
          python research/liftcut-agent/prepare_e1_execution.py --drill --day --output-dir research/liftcut-agent/outputs/ci-e1-day --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          r=Path('research/liftcut-agent')
          sys.path.insert(0,str(r))
          actual=json.loads((r/'outputs/ci-e1-day/readiness.json').read_text())
          expected=json.loads((r/'reports/e1-day-readiness-v1.json').read_text())
          for key in ('source_sha256','frozen_execution_digest','scripted_fixture_plan_digest','arms',
                      'model_result','new_model_calls','reserved_task_payloads_read',
                      'development_original_tasks','development_copies','full_scripted_episodes','power_mode'):
              assert actual[key]==expected[key],key
          assert not actual['actual_parent_weight_verified'] and not actual['complete_scripted_delta_restore']
          receipt=json.loads((r/'outputs/ci-e1-day/restored/off-instance-backup.json').read_text())
          assert receipt['episodes_replayed']==0 and not receipt['complete_study_replayed']
          assert not receipt['model_result'] and not receipt['actual_external_weight_verified']
          from analyze_prior_lease import analyze
          assert analyze()==json.loads((r/'reports/prior-lease-efficiency-20261013.json').read_text())
          PY

      - name: Reject altered E1 native tokens, inverse mappings, episodes and archive bytes
        env:
          LIFTCUT_E1_DRILL: research/liftcut-agent/outputs/ci-e1-runtime
          LIFTCUT_TOKENIZER_DIR: research/liftcut-agent/outputs/ci-i2-tokenizer
        run: python -m unittest discover -s research/liftcut-agent/tests -p test_e1_evidence.py -v

      - name: Reconstruct actual E1 full tasks, gates, tokens and observed resources without private weights
        run: python research/liftcut-agent/analyze_e1_results.py --public-dir research/liftcut-agent/reports/e1-seed42-2026-10-13 --tokenizer-dir research/liftcut-agent/outputs/ci-i2-tokenizer --check

  p1-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: p1-admin-fixture-only
          POSTGRES_DB: liftcut_p1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftcut_p1_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      P1_TEST_DATABASE_URL: postgresql://postgres:p1-admin-fixture-only@127.0.0.1:5432/liftcut_p1_ci
      P1_RUNTIME_DATABASE_URL: postgresql://liftcut_agent:p1-local-fixture-only@127.0.0.1:5432/liftcut_p1_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:p1:setup
      - run: npm run test:p1
      - name: Fresh schema and upgrade without automatic Data API grants
        env:
          API_GRANTS_TEST_DATABASE_URL: postgresql://postgres:p1-admin-fixture-only@127.0.0.1:5432/liftcut_p1_grants_ci
        run: node --import tsx --test tests/product-db/api-grants.test.ts
      - name: Verify W1a migration against a fresh local PostgreSQL database
        env:
          W1A_TEST_DATABASE_URL: postgresql://postgres:p1-admin-fixture-only@127.0.0.1:5432/liftcut_p1_w1a_ci
        run: |
          psql "$P1_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --command='CREATE DATABASE liftcut_p1_w1a_ci;'
          node --import tsx --test tests/product-db/workout-values.test.ts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/liftcut-agent/requirements-tokenizer.txt
      - run: pip install -r research/liftcut-agent/requirements-tokenizer.txt
      - uses: actions/cache/restore@v6
        id: p1m-tokenizer-cache
        with:
          path: research/liftcut-agent/outputs/ci-tokenizer-cache
          key: pinned-tokenizer-v1-${{ hashFiles('research/liftcut-agent/configs/qwen3-4b-tokenizer.json') }}
      - name: Verify P1-M pinned tokenizer cache
        run: python tools/ci_tokenizer.py --output-dir research/liftcut-agent/outputs/ci-p1m-tokenizer --cache-dir research/liftcut-agent/outputs/ci-tokenizer-cache
      # P1-M is a frozen research system, not a freeze of the evolving product schema.
      # Keep every original check, but run it against its exact reviewed sources/database.
      - uses: actions/checkout@v7
        with:
          ref: 1c7e25bdcde8eb0acdd4f171e8b8e23475ec9d06
          path: research/liftcut-agent/outputs/p1m-frozen-w1a
      - name: Prepare isolated frozen P1-M database and dependencies
        working-directory: research/liftcut-agent/outputs/p1m-frozen-w1a
        run: |
          npm ci
          psql "$P1_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --command='CREATE DATABASE liftcut_p1_model_ci;'
          P1_TEST_DATABASE_URL=postgresql://postgres:p1-admin-fixture-only@127.0.0.1:5432/liftcut_p1_model_ci npm run test:p1:setup
      - name: Check P1-M immutable sources, negative gates and actual database/native recovery
        working-directory: research/liftcut-agent/outputs/p1m-frozen-w1a
        env:
          P1M_TOKENIZER: ${{ github.workspace }}/research/liftcut-agent/outputs/ci-p1m-tokenizer
          P1_TEST_DATABASE_URL: postgresql://postgres:p1-admin-fixture-only@127.0.0.1:5432/liftcut_p1_model_ci
          P1_RUNTIME_DATABASE_URL: postgresql://liftcut_agent:p1-local-fixture-only@127.0.0.1:5432/liftcut_p1_model_ci
        run: |
          python research/p1-model/prepare.py check > /tmp/p1m-source-check.json
          python -m unittest discover -s research/p1-model -p test_protocol.py -v
          python research/p1-model/relay.py --output-dir research/liftcut-agent/outputs/ci-p1m --tokenizer-dir "$P1M_TOKENIZER"
          python research/p1-model/restore.py backup --directory research/liftcut-agent/outputs/ci-p1m > /tmp/p1m-inventory.json
          python research/p1-model/restore.py restore --directory research/liftcut-agent/outputs/ci-p1m --output research/liftcut-agent/outputs/ci-p1m-restored --tokenizer-dir "$P1M_TOKENIZER"
          python tools/check_p1m_publication.py --extract-dir research/liftcut-agent/outputs/ci-p1m-published
          python research/p1-model/restore.py restore --directory research/liftcut-agent/outputs/ci-p1m-published --output research/liftcut-agent/outputs/ci-p1m-published-restored --tokenizer-dir "$P1M_TOKENIZER"
          python research/p1-model/prepare.py stage --output /tmp/p1m-code.tar.gz
          python research/p1-model/prepare.py install --archive /tmp/p1m-code.tar.gz --output /tmp/p1m-installed
      - name: Check original published P1 hashes and approval/receipt consistency
        run: node --conditions=react-server --import tsx research/p1-application/audit-publication.ts research/liftcut-agent/reports/p1-application-2026-10-13
      - name: Verify 24 scripted workflows and recover their exact database snapshots
        run: |
          npm run p1:rehearse -- research/liftcut-agent/outputs/ci-p1-workflows
          npm run p1:audit -- research/liftcut-agent/outputs/ci-p1-workflows
          pg_dump "$P1_TEST_DATABASE_URL" --format=custom --file=/tmp/p1-ci.dump
          psql "$P1_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --command='CREATE DATABASE liftcut_p1_restored;'
          RESTORED_URL="${P1_TEST_DATABASE_URL/liftcut_p1_ci/liftcut_p1_restored}"
          pg_restore --exit-on-error --dbname="$RESTORED_URL" /tmp/p1-ci.dump
          P1_TEST_DATABASE_URL="$RESTORED_URL" npm run p1:audit -- research/liftcut-agent/outputs/ci-p1-workflows
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.p1.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p1-browser-evidence
          path: |
            research/liftcut-agent/outputs/p1-browser*
            research/liftcut-agent/outputs/p1m-frozen-w1a/research/liftcut-agent/outputs/ci-p1m/
            research/liftcut-agent/outputs/p1m-frozen-w1a/research/liftcut-agent/outputs/ci-p1m-restored/
            research/liftcut-agent/outputs/p1m-frozen-w1a/research/liftcut-agent/outputs/ci-p1m-published-restored/

  today-session:
    runs-on: ubuntu-latest
    # DB upgrade + production build + 95 serial browser cases + Expo export.
    # Keep per-test timeouts/retries unchanged; 15m cut the suite off at 42/95.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: w1b-admin-fixture-only
          POSTGRES_DB: liftcut_p1_w1b_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftcut_p1_w1b_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      W1B_TEST_DATABASE_URL: postgresql://postgres:w1b-admin-fixture-only@127.0.0.1:5432/liftcut_p1_w1b_ci
      W1B_RUNTIME_DATABASE_URL: postgresql://liftcut_workout:w1b-local-fixture-only@127.0.0.1:5432/liftcut_p1_w1b_ci
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55440
      NEXT_PUBLIC_SUPABASE_ANON_KEY: w1b-local-fixture-anon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade actual W1a schema and verify PostgreSQL transactions and RLS
        run: |
          node --conditions=react-server --import tsx --test tests/product-db/today.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/workout-commands.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/m4-confirmed-context.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/outbox.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/exercise-replacement.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/personal-records.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/coach-model.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/coach-workout-source.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/workout-conversation.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/coach-execution.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/coach-history.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/guest-ai.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/plan-conversation.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/plan-memory.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/progression-history.test.ts
          node --conditions=react-server --import tsx --test tests/product-db/workout-review.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Mobile browser to API to PostgreSQL including lost responses and disabled flag
        run: npx playwright test --config playwright.w1b.config.ts
      - name: Expo app web export signs in and reads today through a bearer token
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55440
          EXPO_PUBLIC_SUPABASE_ANON_KEY: w1b-local-fixture-anon
          EXPO_PUBLIC_API_URL: http://localhost:3103
        run: |
          npm ci --prefix apps/mobile
          (cd apps/mobile && npx expo export --platform web)
          npx playwright test --config playwright.mobile.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: today-browser-evidence
          include-hidden-files: true
          path: |
            node_modules/.cache/w1b/*.png
            node_modules/.cache/w1b/browser/
            node_modules/.cache/w3a/*.png
            node_modules/.cache/w3b/*.png
            node_modules/.cache/coach/*.png
            node_modules/.cache/minimal/*.png
            node_modules/.cache/coach-model/*.png
            node_modules/.cache/coach-stream-release/*.png
            node_modules/.cache/coach-history-release/*.png
            node_modules/.cache/guest-ai/*.png
            node_modules/.cache/mobile-web/*.png
            node_modules/.cache/mobile-web/browser/

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # A separate npm project: React Native pins its own React, so it is not a workspace.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the Android and iOS JavaScript with Hermes (no native build on Linux)
        run: npm run export:check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-ci-placeholder
      NEXT_PUBLIC_WECHAT_LOGIN_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check shared core without DOM or Node types
        run: npm run typecheck -w @liftcut/core

      - name: Evaluate synthetic workout parsing without model calls
        run: node --import tsx scripts/eval-workout-parser.ts > workout-parser-report.json

      - uses: actions/upload-artifact@v6
        with:
          name: workout-parser-evaluation
          path: workout-parser-report.json

      - name: Replay recorded post-workout reviews without model calls
        run: npm run m2:review -- --check

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify W1a mobile guest save and reload without hosted services
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.w1a.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: w1a-browser-evidence
          include-hidden-files: true
          path: |
            node_modules/.cache/w1a/*.png
            node_modules/.cache/w1a/browser/
